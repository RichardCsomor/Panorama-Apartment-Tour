/* =================================================
   APARTMENT SELECTOR
================================================= */

.apartment-selector{

    width:min(95vw,1200px);

    margin:30px auto 40px;

    text-align:left;

}


.apartment-selector h2{

    font-size:20px;

    margin-bottom:15px;

}


.apartment-list{

    display:flex;

    gap:12px;

    overflow-x:auto;

    padding:5px 5px 15px;

    scroll-behavior:smooth;

}


.apartment-list::-webkit-scrollbar{

    height:7px;

}


.apartment-list::-webkit-scrollbar-thumb{

    background:#777;

    border-radius:10px;

}


.apartment{

    flex:0 0 150px;

    height:105px;

    border:3px solid transparent;

    border-radius:10px;

    overflow:hidden;

    background:#222;

    cursor:pointer;

    opacity:.55;

    transition:.2s ease;

}


.apartment:hover{

    opacity:.85;

    transform:translateY(-3px);

}


.apartment.active{

    opacity:1;

    border-color:white;

    transform:translateY(-4px);

}


.apartment img{

    width:100%;

    height:100%;

    object-fit:cover;

    display:block;

}


.apartment-label{

    margin-bottom:6px;

    color:#aaa;

    font-size:12px;

    font-weight:bold;

}


@media(max-width:600px){

    .apartment-selector{

        width:100%;

        margin-top:25px;

    }


    .apartment{

        flex:0 0 125px;

        height:90px;

    }

}

</style>

/* =================================================
   PANORAMA VIEWER
================================================= */

let viewer = null;



function openPanorama(image){

    document
        .getElementById("panorama-view")
        .style.display = "block";


    if(viewer){

        viewer.destroy();

    }


    viewer = pannellum.viewer(
        "panorama",
        {

            type:"equirectangular",

            panorama:image,

            autoLoad:true,

            showControls:true,

            mouseZoom:true

        }
    );


    setTimeout(function(){

        if(viewer){

            viewer.resize();

        }

    },500);

}



function closePanorama(){

    document
        .getElementById("panorama-view")
        .style.display = "none";


    if(viewer){

        viewer.destroy();

        viewer = null;

    }

}



/* =================================================
   CREATE DOT
================================================= */

function createDot(
    wrapper,
    roomName,
    roomData
){

    const dot =
        document.createElement("div");


    dot.className =
        "dot " + roomName;


    dot.style.top =
        roomData.top + "%";


    dot.style.left =
        roomData.left + "%";


    dot.onclick =
        function(){

            openPanorama(
                roomData.panorama
            );

        };


    wrapper.appendChild(dot);

}



/* =================================================
   CREATE APARTMENT DOTS
================================================= */

function createApartmentDots(number){

    const wrapper =
        document.querySelector(
            ".floorplan-wrapper"
        );


    /* Remove old dots */

    wrapper
        .querySelectorAll(".dot")
        .forEach(function(dot){

            dot.remove();

        });


    const apartment =
        apartments[number];


    /* Living room */

    createDot(
        wrapper,
        "living",
        apartment.living
    );


    /* Kitchen */

    createDot(
        wrapper,
        "kitchen",
        apartment.kitchen
    );


    /* Bedroom */

    createDot(
        wrapper,
        "bedroom",
        apartment.bedroom
    );


    /* Bathroom */

    createDot(
        wrapper,
        "bathroom",
        apartment.bathroom
    );

}



/* =================================================
   SELECT APARTMENT
================================================= */

function selectApartment(number){

    const floorplan =
        document.getElementById(
            "floorplan"
        );


    const apartment =
        apartments[number];


    /* Change floorplan */

    floorplan.src =
        apartment.floorplan;


    /* Change dots */

    createApartmentDots(number);


    /* Highlight thumbnail */

    const apartmentButtons =
        document.querySelectorAll(
            ".apartment"
        );


    apartmentButtons.forEach(
        function(button,index){

            button.classList.toggle(
                "active",
                index === number - 1
            );

        }
    );


    /* Scroll selected thumbnail */

    if(apartmentButtons[number - 1]){

        apartmentButtons[number - 1]
            .scrollIntoView({

                behavior:"smooth",

                block:"nearest",

                inline:"center"

            });

    }

}
